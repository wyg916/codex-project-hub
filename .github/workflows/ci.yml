name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  backend:
    name: Backend tests and audit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pylock.toml
      - name: Create project virtual environment
        run: python -m venv .venv
      - name: Install verified packaging toolchain
        run: .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-bootstrap.txt
      - name: Verify Python lock before consuming artifacts
        run: .\.venv\Scripts\python.exe scripts/verify-python-lock.py
      - name: Install Python dependencies
        run: .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r backend/pylock.toml
      - name: Verify Python environment
        run: |
          .\.venv\Scripts\python.exe -m pip check
          .\.venv\Scripts\python.exe -m pip_audit --local --strict --progress-spinner off
      - name: Run backend tests
        run: .\.venv\Scripts\python.exe -m pytest backend/tests

  frontend:
    name: Frontend tests and build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check whitespace errors
        run: git diff --check

  e2e:
    name: Playwright acceptance
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pylock.toml
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create project virtual environment
        run: python -m venv .venv
      - name: Install project dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-bootstrap.txt
          .\.venv\Scripts\python.exe scripts/verify-python-lock.py
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r backend/pylock.toml
          npm --prefix frontend ci
          npm --prefix frontend exec -- playwright install chromium
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Run Playwright tests
        run: npm --prefix frontend run e2e
